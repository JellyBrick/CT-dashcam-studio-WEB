name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A Pages deployment replaces the whole site, so every run publishes main at the
# root, dev under /dev/ and the PR 1 preview under /preview/pr-1/ together.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the PR 1 preview fixes
        uses: actions/checkout@v4
        with:
          ref: 471c571f5f90646806c289e7071aa22170b42198
          persist-credentials: false

      - name: Set up Node.js for the preview
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Build PR 1 for /preview/pr-1/
        env:
          VITE_BASE_PATH: /CT-dashcam-studio-WEB/preview/pr-1/
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const info = { channel: 'preview', pullRequest: 1, commit };
          writeFileSync('dist/deployment.json', JSON.stringify(info, null, 2) + '\n');
          JS

      - name: Upload the preview build
        uses: actions/upload-artifact@v4
        with:
          name: pr-1-preview
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: build-preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          path: production-source

      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev
          path: dev-source

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: production-source/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: production-source/.nvmrc
          cache: pnpm
          cache-dependency-path: production-source/pnpm-lock.yaml

      - name: Build main for the site root
        working-directory: production-source
        env:
          VITE_BASE_PATH: /CT-dashcam-studio-WEB/
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          node scripts/write-deployment-info.mjs production
          mkdir -p ../site_out
          cp -r dist/. ../site_out/

      # dev may still use npm until it is merged with main; a failing dev build
      # must not take the production site down with it.
      - name: Build dev for /dev/
        id: dev
        continue-on-error: true
        working-directory: dev-source
        env:
          VITE_BASE_PATH: /CT-dashcam-studio-WEB/dev/
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
            pnpm test
            pnpm build
          else
            npm ci
            npm test
            npm run build
          fi
          node scripts/write-deployment-info.mjs dev
          mkdir -p ../site_out/dev
          cp -r dist/. ../site_out/dev/

      - name: Report a skipped dev site
        if: steps.dev.outcome == 'failure'
        run: echo "::warning::The dev branch failed to build, so this deployment has no /dev/ site."

      - name: Add the PR 1 preview
        uses: actions/download-artifact@v4
        with:
          name: pr-1-preview
          path: site_out/preview/pr-1/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site_out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
